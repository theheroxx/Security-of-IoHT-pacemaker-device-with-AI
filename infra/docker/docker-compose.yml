version: "3.9"

name: ioht-security

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: ioht-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - ioht-net

  ecg-sim:
    build:
      context: ../..
      dockerfile: apps/backend/simulator/ecg-sim/Dockerfile
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: 1883
    depends_on:
      - mqtt-broker
    networks:
      - ioht-net

  network-sim:
    build:
      context: ../..
      dockerfile: apps/backend/simulator/network-sim/Dockerfile
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: 1883
    depends_on:
      - mqtt-broker
    networks:
      - ioht-net

  ecg-ai:
    build:
      context: ../..
      dockerfile: apps/backend/ecg-service/Dockerfile
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: 1883
    depends_on:
      - mqtt-broker
    networks:
      - ioht-net

  network-ai:
    build:
      context: ../..
      dockerfile: apps/backend/network-security-service/Dockerfile
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: 1883
    depends_on:
      - mqtt-broker
    networks:
      - ioht-net

  fusion:
    build:
      context: ../..
      dockerfile: apps/backend/fusion-service/Dockerfile
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: 1883
    depends_on:
      - mqtt-broker
    networks:
      - ioht-net

  dashboard:
    build:
      context: ../..
      dockerfile: apps/frontend/dashboard/Dockerfile
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: 1883
      PYTHONPATH: /app/logs
      LOG_DIR: /app/storage/logs
    ports:
      - "8501:8501"
    volumes:
      - ../../storage/logs:/app/storage/logs
    depends_on:
      - mqtt-broker
      - ecg-ai
      - network-ai
      - fusion
    networks:
      - ioht-net

networks:
  ioht-net:
    driver: bridge
